name: PCG Public Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pcg-public-integrity.yml"
      - "scripts/**"
      - "tests/**"
      - "*.md"
  push:
    branches:
      - main
      - docs/capacity-allocation-clarification-2026-11-26
    paths:
      - ".github/workflows/pcg-public-integrity.yml"
      - "scripts/**"
      - "tests/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: pcg-public-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Validate public governance and research integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run project integrity tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate source-of-truth documents
        run: python scripts/validate_project_integrity.py
